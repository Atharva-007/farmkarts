name: farmkarts_new
description: A new Flutter project.
publish_to: 'none' # Remove this line if you intend to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.1.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase authentication with OAuth
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  firebase_database: ^12.2.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.2.0
  firebase_messaging: ^16.1.3
  
  # OAuth providers
  google_sign_in: ^7.2.0
  # flutter_facebook_auth: ^6.0.4  # Disabled - not needed for now
  sign_in_with_apple: ^7.0.1
  
  # Payment Gateway Integration
  razorpay_flutter: ^1.4.3
  upi_india: ^3.0.1  # UPI payment integration
  
  # Generative AI
  google_generative_ai: ^0.4.3
  
  # Enhanced UI and functionality
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  permission_handler: ^12.0.1
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  http: ^1.6.0
  intl: ^0.20.2
  shimmer: ^3.0.0
  printing: ^5.14.3
  
  # UI and other dependencies
  cupertino_icons: ^1.0.8
  pdf: ^3.11.3
  google_maps_flutter: ^2.14.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_spinkit: ^5.2.2
  
  # Enhanced features for modern agriculture app
  cached_network_image: ^3.4.1
  fl_chart: ^1.1.0
  url_launcher: ^6.3.2
  connectivity_plus: ^7.0.0
  lottie: ^3.3.1
  smooth_page_indicator: ^2.0.1
  pull_to_refresh: ^2.0.0
  flutter_rating_bar: ^4.0.1
  animations: ^2.1.1
  
  # Media and file handling
  image_picker: ^1.2.1
  file_picker: ^10.3.10
  video_player: ^2.10.1
  photo_view: ^0.15.0
  video_thumbnail: ^0.5.6
  
  # State management and utilities
  provider: ^6.1.5+1
  rxdart: ^0.28.0
  uuid: ^4.5.3
  dio: ^5.9.2
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3
  badges: ^3.1.2
  crypto: ^3.0.7
  
  # Offline database
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  path: ^1.9.1
  
  # Notifications and analytics
  flutter_local_notifications: ^20.1.0
  firebase_analytics: ^12.2.0
  firebase_app_check: ^0.4.2
  firebase_crashlytics: ^5.1.0
  firebase_performance: ^0.11.2
  firebase_in_app_messaging: ^0.9.1
  youtube_player_flutter: ^9.1.3
  
  # Background processing
  # workmanager: ^0.5.2  # Temporarily disabled due to Flutter embedding API incompatibility
  
  # Additional dependencies for enhanced contact seller functionality
  # fluttertoast: ^8.2.8  # Temporarily disabled due to Flutter embedding API incompatibility

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Testing dependencies
  mockito: ^5.4.4
  build_runner: ^2.4.9
  fake_cloud_firestore: ^4.1.0+1
  firebase_auth_mocks: ^0.15.1
  network_image_mock: ^2.1.1
  integration_test:
    sdk: flutter

# Override dependencies to resolve potential conflicts
dependency_overrides:
  collection: ^1.18.0
  connectivity_plus_platform_interface: ^2.0.1
  flutter_inappwebview: ^6.0.0
  vector_math: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/lottie/

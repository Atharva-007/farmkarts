name: farmkarts_new
description: A new Flutter project.
publish_to: 'none' # Remove this line if you intend to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.1.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase core and authentication - Working versions
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  firebase_database: ^10.5.7
  cloud_firestore: ^4.17.5
  
  # Enhanced UI and functionality
  path_provider: ^2.1.4
  share_plus: ^7.2.2
  permission_handler: ^11.4.0
  http: ^1.1.0
  intl: ^0.18.1
  shimmer: ^3.0.0
  printing: ^5.12.0
  
  # UI and other dependencies
  cupertino_icons: ^1.0.8
  pdf: ^3.10.4
  google_maps_flutter: ^2.6.1
  geolocator: ^10.1.1
  geocoding: ^2.2.2
  flutter_spinkit: ^5.2.1
  
  # Enhanced features for modern agriculture app (selected compatible ones)
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0
  url_launcher: ^6.2.5
  connectivity_plus: ^5.0.2
  lottie: ^3.1.0
  smooth_page_indicator: ^1.1.0
  pull_to_refresh: ^2.0.0
  flutter_rating_bar: ^4.0.1
  animations: ^2.0.11
  
  # flutter_local_notifications: ^15.1.3  # Temporarily disabled

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# Override dependencies to resolve potential conflicts
dependency_overrides:
  collection: ^1.18.0

flutter:
  uses-material-design: true

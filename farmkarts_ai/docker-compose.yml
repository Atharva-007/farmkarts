version: '3.8'

services:
  ai-service:
    build: 
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: farmkart_ai_service
    restart: unless-stopped
    environment:
      - AI_INTERNAL_KEY=${AI_INTERNAL_KEY}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD}
      - MAX_CONTEXT_CHUNKS=${MAX_CONTEXT_CHUNKS}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ./ai_service/data:/app/data
      - ./ai_service/faiss_index.bin:/app/faiss_index.bin:ro
      - ./ai_service/faiss_meta.json:/app/faiss_meta.json:ro
      - ./ai_service/corpus.jsonl:/app/corpus.jsonl:ro
    ports:
      - "${AI_SERVICE_PORT}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - farmkart_ai_network

  node-proxy:
    build: 
      context: ./node_proxy
      dockerfile: Dockerfile
    container_name: farmkart_node_proxy
    depends_on:
      ai-service:
        condition: service_healthy
    environment:
      - AI_URL=http://ai-service:8000/ask
      - AI_INTERNAL_KEY=${AI_INTERNAL_KEY}
      - FIREBASE_CRED_PATH=/secrets/firebase-admin.json
      - PORT=${PORT}
    volumes:
      - ./secrets:/secrets:ro
    ports:
      - "${PORT}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - farmkart_ai_network

networks:
  farmkart_ai_network:
    driver: bridge

volumes:
  ai_data:
    driver: local
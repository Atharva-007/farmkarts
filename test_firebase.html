<!DOCTYPE html>
<html>
<head>
    <title>Test Firebase Add Product</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="status">Testing Firebase connection...</div>
    
    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBirSzwlaVmycUCxpAE4324nxibd4THy4o",
            authDomain: "farmkart-9f4f3.firebaseapp.com",
            databaseURL: "https://farmkart-9f4f3-default-rtdb.firebaseio.com",
            projectId: "farmkart-9f4f3",
            storageBucket: "farmkart-9f4f3.firebasestorage.app",
            messagingSenderId: "709785957438",
            appId: "1:709785957438:web:79a3c3de4243c0ed134d6f"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        async function testFirestore() {
            try {
                // Test Firestore connection by adding a test document
                const testRef = await db.collection('test').add({
                    message: 'Test connection',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                document.getElementById('status').innerHTML = `
                    ✅ Firebase connection successful!<br>
                    Test document ID: ${testRef.id}
                `;
                
                // Now test adding a product-like document
                const productRef = await db.collection('products').add({
                    name: 'Test Product',
                    description: 'This is a test product',
                    category: 'Vegetables',
                    price: 100,
                    unit: 'kg',
                    sellerId: 'test-seller',
                    sellerName: 'Test Seller',
                    location: 'Test Location',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    isAvailable: true,
                    quantity: 10,
                    tags: ['test'],
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                document.getElementById('status').innerHTML += `<br>
                    ✅ Product test successful!<br>
                    Product ID: ${productRef.id}
                `;
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('status').innerHTML = `
                    ❌ Error: ${error.message}<br>
                    Code: ${error.code}
                `;
            }
        }
        
        // Test when page loads
        testFirestore();
    </script>
</body>
</html>
